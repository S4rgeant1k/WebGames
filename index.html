<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PC BUILD SIM — симулятор сборки компьютеров</title>
  <meta name="description" content="Браузерный 3D-симулятор компьютерной мастерской: ходите по мастерской, принимайте заказы, собирайте и чините ПК.">
  <meta name="theme-color" content="#1fa9e1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231fa9e1'/%3E%3Crect x='10' y='5' width='12' height='22' rx='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='10' r='2' fill='%23f39200'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="m-walk">
  <div id="view"></div>

  <!-- ── HUD (ходьба) ─────────────────────────────────────── -->
  <div id="hud">
    <div class="hud-day" id="hudDay"></div>
    <div class="hud-tracker" id="tracker"></div>
    <div class="hud-stats" id="hudStats"></div>
    <div class="crosshair" id="cross"></div>
    <div class="prompt hidden" id="prompt"></div>
    <div class="keys-help" id="keysHelp"></div>
  </div>

  <!-- ── Верстак ───────────────────────────────────────────── -->
  <div id="buildUI">
    <button class="exit-sq" id="btnExit" title="Отойти от верстака (Esc)"></button>
    <div class="pc-title" id="pcTitle"></div>
    <section class="panel job-panel" id="jobPanel">
      <header class="panel-h"><span id="jobTitle">Заказ</span><button class="panel-min" id="jobMin" title="Свернуть"></button></header>
      <div class="panel-b" id="jobBody"></div>
    </section>
    <div class="tool-hint" id="hint"></div>
    <nav class="toolbar" id="toolbar"></nav>
  </div>

  <!-- ── Инвентарь (верстак и склад) ───────────────────────── -->
  <section class="panel inv-panel" id="inv">
    <header class="panel-h"><span id="invTitle">Инвентарь</span><button class="panel-x" id="invClose" title="Закрыть"></button></header>
    <div class="inv-tabs" id="invTabs"></div>
    <div class="inv-list" id="invList"></div>
    <div class="inv-detail" id="invDetail"></div>
  </section>

  <!-- ── «Операционная система» компьютеров ─────────────────── -->
  <div id="os" class="hidden">
    <button class="exit-sq" id="osExit" title="Выйти (Esc)"></button>
    <div class="os-screen">
      <div class="os-desk" id="osDesk"></div>
      <div class="os-wins" id="osWins"></div>
      <div class="os-bar">
        <div class="os-start">Os</div>
        <div class="os-tabs" id="osTabs"></div>
        <div class="os-tray" id="osTray"></div>
      </div>
    </div>
  </div>

  <!-- ── Мобильное управление ──────────────────────────────── -->
  <div id="joy"><div id="joyKnob"></div></div>
  <button id="btnAct" class="act-btn"></button>
  <button id="btnInvMob" class="mob-btn"></button>
  <button id="btnMenuMob" class="mob-btn"></button>

  <!-- ── Меню / окна ───────────────────────────────────────── -->
  <div id="menu" class="overlay">
    <div class="menu-box">
      <div class="logo"><span class="logo-pc">PC</span> BUILD SIM</div>
      <div class="menu-sub">Симулятор компьютерной мастерской</div>
      <div class="menu-btns" id="menuBtns"></div>
      <div class="menu-foot">Игра работает прямо в браузере и сохраняется автоматически.</div>
    </div>
  </div>
  <div id="modalWrap" class="overlay hidden"><div class="modal" id="modal"></div></div>
  <div id="ctx" class="ctx hidden"></div>
  <div id="tooltip" class="tooltip hidden"></div>
  <div id="toasts"></div>

  <a class="gh-float" id="ghFloat" href="https://github.com/S4rgeant1k/WebGames" title="Вернуться на страницу GitHub"></a>

  <script type="module" src="assets/game.js"></script>
</body>
</html>
